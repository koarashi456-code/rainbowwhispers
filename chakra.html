  .ck-q{font-family:"Noto Serif TC",serif;font-size:19px;color:var(--ink);line-height:1.6;min-height:62px;display:flex;align-items:center;justify-content:center}
  .ck-opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;margin-top:11px;font-size:15px;color:var(--ink);cursor:pointer;text-align:left;transition:border-color .12s,background .12s}

  .ck-opt .rd{width:18px;height:18px;border-radius:50%;border:2px solid #CBB68E;flex:none}

  .ck-back{margin-top:16px;color:var(--soft);font-size:13px;background:none;border:none;cursor:pointer}

  .ck-rsub{font-size:12px;letter-spacing:.14em;color:#B5713F}
  .ck-rtitle{font-family:"Noto Serif TC",serif;font-size:22px;color:var(--brush);margin-top:6px}

  .ck-say{background:#FBF6EC;border:1.5px solid #EFE3CE;border-radius:16px;padding:14px 16px;margin-top:12px;text-align:left}

  .ck-say .n{font-family:"Noto Serif TC",serif;font-size:17px;font-weight:600;margin:3px 0 6px}
  .ck-say .t{font-size:14.5px;color:var(--ink);line-height:1.8}
  .ck-note{font-size:11.5px;color:#A99;margin-top:16px;line-height:1.7}
  /* 推薦引路人 */
  .ck-reclab{font-size:12px;letter-spacing:.1em;color:#B5713F;text-align:center;margin:22px 0 4px}
  .ck-recdir{font-size:13px;color:var(--soft);line-height:1.7;text-align:center;margin-bottom:12px}
  .ck-reccard{display:block;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 44px 13px 15px;margin-top:9px;position:relative;text-align:left}
  .ck-reccard:hover{border-color:#C9A7DE}
  .ck-recname{font-family:"Noto Serif TC",serif;font-size:15px;color:var(--brush)}
  .ck-recreg{font-family:"Noto Sans TC",sans-serif;font-size:11.5px;color:var(--soft);font-weight:400;margin-left:7px}
  .ck-recchips{margin-top:7px;display:flex;flex-wrap:wrap;gap:5px}
  .ck-chip{font-size:11.5px;color:var(--soft);background:var(--tint);border-radius:999px;padding:2px 9px}
  .ck-recgo{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:#C9A7DE;font-size:15px}
  .ck-recempty{font-size:13px;color:var(--soft);text-align:center;padding:8px}

var CHAKRAS=[
  {k:'root',  name:'海底輪',        sub:'安穩的根',   color:'var(--c1)', blurb:'你最近也許有點不安、像站在浮動的地面上。先把生活的基本好好照顧——根穩了，其他才長得出來。', rec:{dir:'先把根基穩住——適合擅長 八字、紫微、命理塔羅 的引路人，幫你看清現實、重建安全感。', kw:['八字','紫微','命理','塔羅','占卜']}},
  {k:'sacral',name:'臍輪',          sub:'流動的情感', color:'var(--c2)', blurb:'你可能壓抑了一些情緒或渴望。允許自己去感受、也允許自己快樂，水才會再次流動起來。', rec:{dir:'讓情緒重新流動——適合 OH卡、情感療癒、塔羅，陪你好好梳理感受。', kw:['OH卡','情感','療癒','塔羅','占卜']}},
  {k:'solar', name:'太陽神經叢輪',  sub:'自信的火',   color:'var(--c3)', blurb:'你也許對自己有點沒把握。其實你比想像中更有力量，先從一件小事、好好肯定自己開始。', rec:{dir:'找回力量與方向——適合 占星、生命靈數、人類圖，幫你看見自己的天賦。', kw:['占星','生命靈數','人類圖','塔羅']}},
  {k:'heart', name:'心輪',          sub:'愛的連結',   color:'var(--c4)', blurb:'你最近也許對自己或別人築起了一道牆。先對自己溫柔一點，心打開了，連結就會慢慢回來。', rec:{dir:'打開心、修復關係——適合 感情塔羅、關係諮詢，陪你把心照顧好。', kw:['感情','關係','塔羅','占卜']}},
  {k:'throat',name:'喉輪',          sub:'真實的聲音', color:'var(--c5)', blurb:'有些話你一直放在心裡沒說出口。你的感受值得被聽見——從說出一句真心話開始。', rec:{dir:'把真實的聲音說出來——適合 溝通諮詢、聲音療癒、塔羅。', kw:['溝通','聲音','療癒','塔羅']}},
  {k:'third', name:'眉心輪',        sub:'直覺與清明', color:'var(--c6)', blurb:'你最近想得多、卻不太信任自己的直覺。讓思緒慢下來，答案其實一直都在。', rec:{dir:'信任直覺、看清方向——適合 塔羅、占星、靈擺、直覺開發。', kw:['塔羅','占星','靈擺','直覺','占卜']}},
  {k:'crown', name:'頂輪',          sub:'平靜與信任', color:'var(--c7)', blurb:'你也許有點失去方向或意義感。給自己一些安靜的空間，重新接上那個更大的流動。', rec:{dir:'接回平靜與意義——適合 靈氣、能量療癒、靈性諮詢、冥想。', kw:['靈氣','能量','靈性','冥想','療癒']}}
];

var CK_READS={"root": ["你最近也許有點不安、像站在浮動的地面上。先把生活的基本好好照顧——根穩了，其他才長得出來。", "你可能一直處在「要撐住」的狀態，身體和心都繃得很緊。安全感需要被重新建立，找人一起看看，是哪裡讓你覺得不踏實。", "對錢、工作或住的地方，你心裡也許藏著擔心。這些不安是在提醒你：先照顧好最基本的需要，才有力氣往前走。", "你最近可能常覺得累、提不起勁，好像怎麼休息都不夠。這是根基在跟你說：慢下來，先把自己接住。", "生活的變動讓你有點失去重心，像少了一個可以依靠的地方。試著找回規律的作息，也找一個能陪你理清現況的人。", "你習慣自己扛下所有事，卻很少問自己「我安不安全」。允許自己被支持，根才會慢慢長穩。", "你也許常常想很多「萬一」，對未來有說不出的焦慮。把注意力帶回此刻的身體與生活，安定感會一點一點回來。", "家庭或成長的課題，可能還在影響你的安全感。這不是你的錯，有人陪你看清楚，會比一個人摸索輕鬆很多。", "你很努力想讓一切穩定，卻好像一直在原地打轉。先處理最實際的一件小事，踏實的感覺會從那裡開始。", "你的根基需要一點滋養：好好吃飯、好好睡、多接觸大自然。當身體被照顧好，心也會慢慢安下來。"], "sacral": ["你可能壓抑了一些情緒或渴望。允許自己去感受、也允許自己快樂，水才會再次流動起來。", "你最近也許覺得生活有點乾、少了熱情和樂趣。那份生命力還在，只是需要你給它一點空間流動。", "你可能很習慣照顧別人的感受，卻把自己的放在最後。你的情緒也值得被看見、被好好接住。", "關係裡也許有些委屈或失落，還沒有機會好好說出來。讓情緒流動，比假裝沒事更能讓你輕鬆。", "你對自己想要什麼，可能有點不敢承認。誠實面對渴望，是找回快樂的第一步。", "創造力和靈感好像卡住了，做什麼都提不起勁。試著做點不為目的、只為開心的事，水會再次流起來。", "你也許對「享受」有點罪惡感，總覺得要先把該做的做完。其實你本來就值得被生活溫柔款待。", "最近的情緒起伏可能比較大，自己也說不清楚為什麼。找人陪你一起整理，會發現每種情緒都有它的原因。", "你可能在親密關係裡有些不安或距離感。先從了解自己的需要開始，關係才能更自在地流動。", "你的感受很豐富，只是被收得太緊。允許自己哭、允許自己笑，情緒流動了，心也會跟著清澈。"], "solar": ["你也許對自己有點沒把握。其實你比想像中更有力量，先從一件小事、好好肯定自己開始。", "你最近可能很在意別人的眼光，做決定時總是猶豫。你的想法值得被相信，先從小事練習為自己做主。", "你也許常常說「好」，心裡其實想說「不」。守住界線不是自私，而是在保護你的力量。", "比較的心情可能讓你覺得自己不夠好。其實你有自己的節奏和光，只是需要被重新看見。", "你對目標有熱情，卻容易在行動前就先否定自己。把「我不行」換成「我試試看」，力量就會開始流動。", "壓力也許讓你覺得被推著走，失去了主導權。找回「這是我選的」的感覺，你會更有底氣。", "你可能對自己要求很高，做得再好也覺得不夠。學著肯定已經做到的部分，自信才會一點一點累積。", "面對衝突時，你也許習慣退讓，事後又覺得委屈。說出你的立場，不會讓你失去誰，反而會更被尊重。", "你內在有一團火，只是最近被疲累和懷疑蓋住了。照顧好身體、完成一個小目標，火就會重新燒起來。", "你正站在要不要相信自己的路口。有人陪你看清自己的優勢，會讓下一步走得更堅定。"], "heart": ["你最近也許對自己或別人築起了一道牆。先對自己溫柔一點，心打開了，連結就會慢慢回來。", "你付出很多，卻不太習慣接受別人的好。愛需要流進來，也需要流出去，心才不會累。", "過去的傷也許還沒完全癒合，讓你不敢再輕易靠近。慢慢來，有人陪你，心會再次學會信任。", "你最近可能覺得孤單，好像沒有人真正懂你。這份渴望連結的心很珍貴，值得被好好照顧。", "你對自己可能比對別人嚴格得多。試著用對待好朋友的溫柔來對待自己，心會柔軟起來。", "一段關係的結束或改變，也許還在心裡留下空缺。允許自己難過，悲傷也是愛的一種樣子。", "你很怕讓別人失望，常常委屈自己成全大家。先愛自己不是自私，是讓愛能走得長久的方法。", "原諒對你來說也許很難，不管是原諒別人還是自己。放下不代表忘記，而是讓自己不再背著重量走。", "你的心其實很柔軟，只是最近被保護得太緊。找一個安全的地方說說心事，連結會慢慢回來。", "你渴望被理解，也渴望能好好去愛。先從身邊小小的溫暖開始，心門就會一點一點打開。"], "throat": ["有些話你一直放在心裡沒說出口。你的感受值得被聽見——從說出一句真心話開始。", "你可能習慣把意見吞下去 function compute(){

  CHAKRAS.forEach(function(c){sum[c.k]=0;cnt[c.k]=0;});
  QUESTIONS.forEach(function(q,i){ var v=S.answers[i]; if(typeof v==='number'){ sum[q.c]+=v; cnt[q.c]++; } });
  var scores=CHAKRAS.map(function(c){ var pct=cnt[c.k]?Math.round(sum[c.k]/(cnt[c.k]*3)*100):0; return {c:c,pct:pct}; });

  var zeros={}; CHAKRAS.forEach(function(c){ zeros[c.k]=0; }); QUESTIONS.forEach(function(q,i){ if(S.answers[i]===0) zeros[q.c]++; });
  var low=scores.filter(function(x){ return x.pct===min; }).map(function(x){ return x.c.k; });

  var balanced=(low.length>=4) || (max-min<=10);
  return {scores:scores,focus:focus,low:low,balanced:balanced};
}

    h+='<circle cx="100" cy="'+y+'" r="'+(big?8:(on?6.5:5.5))+'" fill="'+col+'" opacity="'+(on?1:.7)+'" stroke="#fff" stroke-width="'+(big?2:1.2)+'"/>';
    h+='<text x="218" y="'+(y+4.5)+'" font-size="'+(big?13:12)+'" font-weight="'+(big?600:400)+'" fill="'+(big?'#6B4A33':'#A9967E')+'">'+c.name+'</text>';
    h+='<text x="328" y="'+(y+4.5)+'" text-anchor="end" font-size="12" font-weight="'+(big?700:400)+'" fill="'+(big?col:'#B8A78E')+'">'+byK[c.k]+'</text>';
  });
  return h+'</svg>';
}
// 解析卡：這個脈輪現在的狀態（引導去找引路人）；每次測驗換一種解析
function ckRead(k){
  var L=CK_READS[k]||[]; if(!L.length) return CKMAP[k].blurb;
  var key='rw_ck_read_'+k, seen=[]; try{ seen=JSON.parse(localStorage.getItem(key)||'[]')||[]; }catch(e){}
  var left=[]; for(var i=0;i<L.length;i++) if(seen.indexOf(i)<0) left.push(i);
  if(!left.length){ seen=[]; left=L.map(function(_,i){ return i; }); }
  var pick=left[Math.floor(Math.random()*left.length)]; seen.push(pick);
  try{ localStorage.setItem(key,JSON.stringify(seen)); }catch(e){}
  return L[pick];
}
var CK_SHOWN={};
function ckSay(k){ var c=CKMAP[k]; CK_SHOWN[k]=ckRead(k);
  return '<div class="ck-say"><div class="h"><span>此刻最需要關注</span></div><div class="n" style="color:'+CK_HEX[k]+'">'+esc(c.name)+' · '+esc(c.sub)+'</div><div class="t">'+esc(CK_SHOWN[k])+'</div></div>'; }
function renderResult(){
  var R=compute(), f=CKMAP[R.focus];
  var names=R.low.map(function(k){ return CKMAP[k].name; });
  var title=R.balanced?'七個脈輪都很平衡':(names.join('、')+(names.length>1?' 都需要被看見':' 需要被看見'));
  var says=R.balanced
    ?'<div class="ck-say"><div class="h"><span>能量狀態</span></div><div class="n" style="color:var(--brush)">平衡而穩定</div><div class="t">你的七個脈輪分數很接近，能量流動得很順。繼續照顧好自己的作息和心情；想更深入認識自己，也可以找引路人聊聊。</div></div>'
    :R.low.map(ckSay).join('');
  var ref=genRef();
  curLead={ref:ref,type:R.balanced?'七個脈輪平衡':R.low.map(function(k){ return CKMAP[k].name+'（'+CKMAP[k].sub+'）'; }).join('、')}; leadSaved=false;
  if(window.rwMemberToken&&window.rwMemberToken()) saveLead();  // 會員登入中：一出結果就記到會員資料
  var msg='我做完彩之語的七大脈輪測驗了！'+(R.balanced?'我的七個脈輪很平衡。':'此刻最需要關注的是「'+R.low.map(function(k){ return CKMAP[k].name+'·'+CKMAP[k].sub; }).join('、')+'」。')+(S.prefs?'配對條件：'+RWMatch.label(S.prefs)+'。':'')+'（代碼 '+ref+'）';
  var lineHref='https://line.me/R/oaMessage/'+encodeURIComponent(CONFIG.lineOaId)+'/?'+encodeURIComponent(msg);
  app.innerHTML='<div class="ck-card">'+
    '<div class="ck-rsub">你的脈輪能量圖</div>'+
    '<div class="ck-rtitle">'+esc(title)+'</div>'+
    ckFigure(R)+says+
    '<div id="ck-rec"></div>'+
    '<a class="ck-cta" href="booking.html#pick" style="text-decoration:none">瀏覽全部引路人</a>'+
    '<a class="ck-ghost" id="ck-line" href="'+lineHref+'" target="_blank" rel="noopener">加 LINE 收結果</a>'+
    '<button class="ck-ghost" id="ck-share" type="button">分享給朋友</button>'+
    '<button class="rw-back" id="ck-prev">‹ 上一頁（修改配對條件）</button>'+
    '<button class="ck-back" id="ck-restart" style="display:block;margin:6px auto 0">重新測一次</button>'+
    '<div class="ck-note">此結果僅供自我覺察與參考，不作為醫療或心理診斷。</div>'+
  '</div>';
  LINE_HREF=lineHref; loadRec(R.focus);
  var lg=document.getElementById('ck-line'); if(lg) lg.onclick=function(){ saveLead(); };
  var shb=document.getElementById('ck-share'); if(shb) shb.onclick=function(){  // 分享圖卡（LINE・IG）：用主要的脈輪＋解析
    var col=CK_HEX[f.k];
    RWShare.open({test:'七大脈輪測驗',kicker:R.balanced?'七大脈輪測驗｜我的能量狀態':'七大脈輪測驗｜此刻最需要關注',title:R.balanced?'七輪平衡':f.name,sub:R.balanced?'平衡而穩定':f.sub,subColor:R.balanced?'#B09A7C':col,accent:R.balanced?'#B5713F':col,
      desc:R.balanced?'七個脈輪的能量很接近，流動得很順。':(CK_SHOWN[f.k]||f.blurb),
      url:location.origin+location.pathname,text:R.balanced?'我做了彩之語的七大脈輪測驗，我的七個脈輪很平衡！你也來看看你的脈輪能量':'我做了彩之語的七大脈輪測驗，此刻最需要關注的是「'+f.name+'·'+f.sub+'」！你也來看看你的脈輪能量'});
  };
  var pv=document.getElementById('ck-prev'); if(pv) pv.onclick=function(){ S.step--; render(); window.scrollTo({top:0,behavior:'smooth'}); };
  var rs=document.getElementById('ck-restart'); if(rs) rs.onclick=function(){ S={step:0,answers:[]}; curLead=null; leadSaved=false; render(); window.scrollTo({top:0,behavior:'smooth'}); };
  window.scrollTo({top:0,behavior:'smooth'});
}
function saveTestResult(topic,result,ref){
  // 會員登入中 → 記到會員本人的客戶檔；沒登入或失敗 → 照舊新增一筆匿名名單
  var prefs=RWMatch.forDb(S.prefs);
  function anon(){ try{fetch(SUPA.url+'/rest/v1/customers',{method:'POST',headers:{'apikey':SUPA.key,'Authorization':'Bearer '+SUPA.key,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({ref_code:ref,topic:topic,result_type:result,status:'新客',test_results:(function(){ var o={}; o['七大脈輪測驗']={result:result,topic:topic}; if(prefs) o['七大脈輪測驗'].prefs=prefs; return o; })()})});}catch(e){} }
  var tk=window.rwMemberToken&&window.rwMemberToken();
  if(!tk){ anon(); return; }
  fetch(SUPA.url+'/rest/v1/rpc/save_my_test_result',{method:'POST',headers:{'apikey':SUPA.key,'Authorization':'Bearer '+tk,'Content-Type':'application/json'},body:JSON.stringify({p_topic:topic,p_result:result,p_ref:ref,p_test:'七大脈輪測驗',p_prefs:prefs})})
    .then(function(r){ if(!r.ok) anon(); }).catch(anon);
}
function saveLead(){
  if(leadSaved||!curLead) return; leadSaved=true;
  saveTestResult('七大脈輪測驗',curLead.type,curLead.ref);
}
// 依焦點脈輪推薦適合的能量引路人（撈 public_guides、用關鍵字比對服務）
var GUIDES_CACHE=null, LINE_HREF='https://lin.ee/t0NBjud0';
async function loadRec(ckKey){
  if(!GUIDES_CACHE){
    try{ var r=await fetch(SUPA.url+'/rest/v1/public_guides?select=id,name,services,region,service_mode,price',{headers:{apikey:SUPA.key}}); GUIDES_CACHE=r.ok?(await r.json()):[]; }catch(e){ GUIDES_CACHE=[]; }
  }
  PRICES=await RWMatch.loadPrices();
  renderRec(ckKey);
}
var PRICES={};
function renderRec(ckKey){
  var box=document.getElementById('ck-rec'); if(!box) return;
  var ck=CKMAP[ckKey], rec=(ck&&ck.rec)||{dir:'',kw:[]}, kw=rec.kw||[];
  var guides=GUIDES_CACHE||[];
  function score(g){ var hay=((g.services||[]).join(' ')+' '+(g.name||'')+' '+(g.service_mode||'')).toLowerCase(); var s=0; kw.forEach(function(k){ if(hay.indexOf(String(k).toLowerCase())>=0) s++; }); return s; }
  // 先挑這個方向的人，再依地區／預算／方式排；沒有這個方向的人就從全部挑
  var ranked=RWMatch.rank(guides,S.prefs,PRICES,score);
  if(!ranked.length) ranked=RWMatch.rank(guides,S.prefs,PRICES,null);
  var picks=ranked.slice(0,2);
  var h='<div class="ck-reclab">為你推薦的能量引路人</div>';
  if(rec.dir) h+='<div class="ck-recdir">'+esc(rec.dir)+'</div>';
  if(S.prefs) h+='<div class="pf-line">依你選的：<b>'+esc(RWMatch.label(S.prefs))+'</b></div>';
  if(picks.length){
    h+=picks.map(function(x){
      var g=x.g, svc=(g.services||[]).slice(0,3).map(function(s){return '<span class="ck-chip">'+esc(s)+'</span>';}).join('');
      return '<a class="ck-reccard" href="guide.html?id='+encodeURIComponent(g.id)+'"><div class="ck-recname">'+esc(g.name||'引路人')+(g.region?'<span class="ck-recreg">'+esc(g.region)+'</span>':'')+'</div>'+(svc?'<div class="ck-recchips">'+svc+'</div>':'')+RWMatch.tagsHTML(x.f)+'<span class="ck-recgo">預約 ›</span></a>';
    }).join('');
  } else {
    h+='<div class="ck-recempty">引路人陸續加入中，先逛逛看看。</div>';
  }
  h+=RWMatch.helpHTML(!picks.length || picks[0].f.bad>0, LINE_HREF);
  box.innerHTML=h;
  var ha=box.querySelector('.mt-help a,.mt-soft a'); if(ha) ha.addEventListener('click',function(){ saveLead(); });
}
render();
</script>

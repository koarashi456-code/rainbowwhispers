<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的訂單｜彩之語 Rainbow Whisper</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .owrap{max-width:560px;margin:0 auto;padding:18px 18px 60px}
  .ohead{display:flex;align-items:center;gap:10px;margin:8px 2px 4px}
  .oback{display:inline-flex;align-items:center;gap:4px;color:var(--soft);text-decoration:none;font-size:14px}
  .oback:hover{color:var(--brush)}
  .otitle{font-family:"Noto Serif TC",serif;font-size:20px;color:var(--brush)}
  .osub{font-size:13px;color:var(--soft);margin:0 2px 14px}

  /* 期間選擇 */
  .operiod{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
  .ochip{font:inherit;font-size:13.5px;color:var(--soft);background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:7px 15px;cursor:pointer;transition:all .15s}
  .ochip.on{background:var(--brush);color:#fff;border-color:var(--brush);font-weight:500}
  .orange{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 14px}
  .orange .rlab{font-size:13px;color:var(--soft)}
  .orange .rdates{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
  .orange .in-sm{font:inherit;font-size:14px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:7px 10px;outline:none;flex:1;min-width:0}
  .orange .in-sm:focus{border-color:#C9A7DE}
  .oclear{font:inherit;font-size:13px;color:var(--brush);background:none;border:1.5px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer}

  .osum{font-size:13.5px;color:var(--soft);margin:2px 2px 10px}
  .osum b{color:var(--brush)}

  /* 訂單卡：乾淨直式列 */
  .ocard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:11px}
  .oc-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .oc-title{font-size:15px;color:var(--brush);font-weight:500;line-height:1.4}
  .oc-title .svc{color:var(--ink);font-weight:400}
  .oc-right{display:flex;align-items:center;gap:8px;white-space:nowrap;flex:none}
  .oc-amt{font-variant-numeric:tabular-nums;color:var(--brush);font-weight:600;font-size:15px}
  .oc-line{font-size:12.5px;color:var(--soft);margin-top:6px;line-height:1.6}
  .oc-line .k{color:#A48C72}
  .status-badge{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px}
  .st-book{background:#FBE7CC;color:#A5643A}
  .st-done{background:#D8ECDF;color:#3F7A5E}
  .st-cancel{background:#EDE6DC;color:#8A7659}
  .st-refund{background:#F3D9DE;color:#B5566E}

  .oempty{text-align:center;color:var(--soft);font-size:14px;padding:38px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px}
  .oloading{text-align:center;color:var(--soft);font-size:14px;padding:40px 20px}
</style>
</head>
<body>

<nav class="rw-nav"><div class="rw-nav-in">
  <a class="rw-brand" href="index.html">彩之語<small>RAINBOW WHISPER</small></a>
  <input type="checkbox" id="rw-burger" class="rw-burger-cb" aria-label="選單"><label for="rw-burger" class="rw-burger" aria-hidden="true"><span></span><span></span><span></span></label>
  <div class="rw-links">
    <a href="index.html">首頁</a>
    <a href="quiz.html">測驗</a>
    <a href="guides.html">引路人介紹</a>
    <a href="booking.html">預約引路人</a>
    <a href="pricing.html">方案</a>
    <a href="account.html" class="on">會員</a>
    <a class="rw-nav-line" href="https://lin.ee/t0NBjud0" target="_blank" rel="noopener">加 LINE</a>
  </div>
</div></nav>

<div id="ord-loading" class="oloading">載入你的訂單中…</div>

<main id="ord-main" class="owrap" hidden>
  <div class="ohead">
    <a class="oback" href="account.html">‹ 會員中心</a>
  </div>
  <div class="otitle rw-serif">我的訂單</div>
  <div class="osub">你在彩之語預約引路人的所有紀錄</div>

  <div class="operiod" id="operiod">
    <button class="ochip on" type="button" data-days="0">全部</button>
    <button class="ochip" type="button" data-days="30">近 30 天</button>
    <button class="ochip" type="button" data-days="90">近 3 個月</button>
    <button class="ochip" type="button" data-days="365">近 1 年</button>
  </div>
  <div class="orange">
    <span class="rlab">自訂</span>
    <div class="rdates">
      <input id="o-from" type="date" class="in-sm">
      <span style="color:var(--soft)">~</span>
      <input id="o-to" type="date" class="in-sm">
    </div>
    <button class="oclear" id="o-clear" type="button">清除</button>
  </div>

  <div class="osum" id="o-sum"></div>
  <div id="o-list"></div>
</main>

<footer class="rw-footer">
  <div class="rw-brand2 rw-serif">彩之語</div>
  <div class="rw-foot-en">RAINBOW WHISPER</div>
  <div class="rw-foot-links" style="margin-top:12px"><a href="account.html">會員中心</a>·<a href="booking.html">預約引路人</a>·<a href="https://lin.ee/t0NBjud0" target="_blank" rel="noopener">聯絡我們</a></div>
  <div class="rw-copy">© 2026 彩之語 Rainbow Whisper</div>
</footer>

<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var db = supabase.createClient(window.SUPA.url, window.SUPA.key);
function $(s){ return document.querySelector(s); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]; }); }
function money(n){ return '$'+Number(n||0).toLocaleString(); }
function fmtDT(s){ if(!s) return '待確認'; var d=new Date(s); return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fmtDay(s){ if(!s) return ''; var d=new Date(s); return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate(); }
function statusBadge(st){ var c=st==='已完成'?'st-done':st==='已取消'?'st-cancel':st==='已退費'?'st-refund':'st-book'; return '<span class="status-badge '+c+'">'+esc(st||'—')+'</span>'; }
function odate(o){ return o.appointment_at || o.created_at; }

var ALL_ORDERS=[], PERIOD_DAYS=0, C_FROM='', C_TO='';

function inPeriod(o){
  var ds=odate(o); if(!ds) return (PERIOD_DAYS===0 && !C_FROM && !C_TO); // 沒日期的只在「全部」出現
  var d=new Date(ds);
  if(C_FROM && d < new Date(C_FROM+'T00:00:00')) return false;
  if(C_TO && d > new Date(C_TO+'T23:59:59')) return false;
  if(!C_FROM && !C_TO && PERIOD_DAYS>0){ var lim=new Date(); lim.setDate(lim.getDate()-PERIOD_DAYS); if(d<lim) return false; }
  return true;
}
function orderCard(o){
  var isMoney = o.status!=='已取消';
  return '<div class="ocard">'
    +'<div class="oc-top"><div class="oc-title">'+esc(o.guide_name||'引路人')+' <span class="svc">'+esc(o.service||'')+'</span></div>'
    +'<div class="oc-right"><span class="oc-amt">'+money(o.amount)+'</span>'+statusBadge(o.status)+'</div></div>'
    +'<div class="oc-line"><span class="k">預約</span> '+fmtDT(o.appointment_at)+'　·　<span class="k">下單</span> '+fmtDay(o.created_at)+'</div>'
    +'<div class="oc-line"><span class="k">付款</span> '+esc(o.method||'—')+(o.order_ref?'　·　<span class="k">編號</span> '+esc(o.order_ref):'')+'</div>'
    +'</div>';
}
function render(){
  var list=ALL_ORDERS.filter(inPeriod);
  var valid=list.filter(function(o){ return o.status!=='已取消' && o.status!=='已退費'; });
  var total=valid.reduce(function(a,o){ return a+Number(o.amount||0); },0);
  $('#o-sum').innerHTML='共 <b>'+list.length+'</b> 筆'+(valid.length?'　·　有效合計 <b>'+money(total)+'</b>':'');
  if(!list.length){ $('#o-list').innerHTML='<div class="oempty">這個期間沒有訂單。<br>換個期間，或到「預約引路人」開始你的第一次。</div>'; return; }
  list.sort(function(a,b){ return new Date(odate(b)) - new Date(odate(a)); });
  $('#o-list').innerHTML=list.map(orderCard).join('');
}

// 期間 chips
$('#operiod').addEventListener('click',function(e){
  var b=e.target.closest('.ochip'); if(!b) return;
  PERIOD_DAYS=Number(b.getAttribute('data-days'))||0;
  C_FROM=''; C_TO=''; $('#o-from').value=''; $('#o-to').value='';
  $('#operiod').querySelectorAll('.ochip').forEach(function(x){ x.classList.toggle('on',x===b); });
  render();
});
// 自訂區間
function customChanged(){
  C_FROM=$('#o-from').value; C_TO=$('#o-to').value;
  if(C_FROM || C_TO){ $('#operiod').querySelectorAll('.ochip').forEach(function(x){ x.classList.remove('on'); }); PERIOD_DAYS=0; }
  render();
}
$('#o-from').addEventListener('change',customChanged);
$('#o-to').addEventListener('change',customChanged);
$('#o-clear').onclick=function(){
  C_FROM=''; C_TO=''; PERIOD_DAYS=0; $('#o-from').value=''; $('#o-to').value='';
  $('#operiod').querySelectorAll('.ochip').forEach(function(x,i){ x.classList.toggle('on',i===0); });
  render();
};

(async function init(){
  var s;
  try{ s=(await db.auth.getSession()).data.session; }catch(e){}
  if(!s){ location.replace('account.html?next=orders.html'); return; }
  try{
    var r=await db.rpc('my_account');
    if(r.error || !r.data){ ALL_ORDERS=[]; }
    else if(r.data.disabled){ $('#ord-loading').remove(); $('#ord-main').hidden=false; $('#o-sum').innerHTML=''; $('#o-list').innerHTML='<div class="oempty" style="color:#C0506A">你的會員後台目前已停用，請聯繫官方 LINE。</div>'; return; }
    else{ ALL_ORDERS=r.data.orders||[]; }
  }catch(e){ ALL_ORDERS=[]; }
  $('#ord-loading').remove();
  $('#ord-main').hidden=false;
  render();
})();
</script>
</body>
</html>

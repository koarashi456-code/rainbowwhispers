   {t:'看見未來',w:{f:2},c:1},{t:'看懂自己',w:{s:2},c:1},
   {t:'看懂別人',w:{r:2},c:1},{t:'改變自己的狀態',w:{a:1,e:1},c:1}]},
 {q:'你比較容易被什麼吸引？',o:[
   {t:'神秘與未知',w:{f:2},c:1},{t:'心理與自我探索',w:{s:2},c:1},
   {t:'命理與人生規律',w:{f:2},c:1},{t:'能量、療癒與身心平衡',w:{e:2},c:1}]},
 {q:'你現在的人生比較像？',o:[
   {t:'正在找方向',w:{f:2},c:1},{t:'正在整理自己',w:{e:1,s:1},c:1},
   {t:'正在面臨轉換',w:{a:1,f:1},c:1},{t:'正在重新成長',w:{a:1,s:1},c:1}]},
 {q:'最後一題，不要想太久——如果現在的你可以收到一句話，你最想聽到？',o:[
   {t:'「你會找到答案的。」',w:{f:2},c:1},{t:'「你其實已經知道自己要什麼。」',w:{s:2},c:2},
   {t:'「這段經歷並不是沒有意義。」',w:{e:2},c:1},{t:'「現在，是你重新開始的時候。」',w:{a:2},c:2}]}
];

/* ===== 引擎 ===== */
var MAXW={s:0,f:0,r:0,e:0,a:0}, MAXC=0;
QUESTIONS.forEach(function(Q){
  var mc=0, md={s:0,f:0,r:0,e:0,a:0};
  Q.o.forEach(function(o){ if((o.c||0)>mc)mc=o.c||0; for(var k in (o.w||{})) if(o.w[k]>md[k])md[k]=o.w[k]; });
  MAXC+=mc; for(var k in md)MAXW[k]+=md[k];
});
function cosine(a,b){var dot=0,na=0,nb=0;['s','f','r','e','a'].forEach(function(k){dot+=a[k]*b[k];na+=a[k]*a[k];nb+=b[k]*b[k];});if(!na||!nb)return 0;return dot/(Math.sqrt(na)*Math.sqrt(nb));}
function compute(){
  var raw={s:0,f:0,r:0,e:0,a:0}, clarity=0;
  S.answers.forEach(function(o){ if(!o)return; for(var k in (o.w||{}))raw[k]+=o.w[k]; clarity+=(o.c||0); });
  var dim={}; ['s','f','r','e','a'].forEach(function(k){ dim[k]=MAXW[k]?Math.round(raw[k]/MAXW[k]*100):0; });
  var order=['s','f','r','e','a'].slice().sort(function(a,b){return dim[b]-dim[a];});
  var top=order[0], second=order[1];
  var spread=dim[top]-dim[second];
  var clarityPct=MAXC?Math.round(clarity/MAXC*100):0;
  var typeKey=(dim[top]<44 || spread<9)?'wander':top;
  // 引路人配對：依你各維度的比重，加權引路人在該維度的強度
  var sumU=(dim.s+dim.f+dim.r+dim.e+dim.a)||1;
  var matches=ARCH.map(function(A){ var ms=0; ['s','f','r','e','a'].forEach(function(k){ ms+=(dim[k]/sumU)*A.v[k]; }); var pct=Math.max(45,Math.min(99,Math.round(ms+8))); return {a:A,pct:pct,score:ms}; }).sort(function(x,y){return y.score-x.score;});
  // 紅黃綠燈
  var green=(typeKey!=='wander' && clarityPct>=55);
  return {dim:dim,order:order,typeKey:typeKey,type:TYPES[typeKey],clarityPct:clarityPct,green:green,matches:matches.slice(0,2)};
}

function esc(t){return (t==null?'':String(t)).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});}

function chooseAns(el,idx){ if(locked)return; locked=true; el.classList.add('sel');
  setTimeout(function(){ S.answers[S.step-1]=QUESTIONS[S.step-1].o[idx]; S.step++; locked=false; render(); },170); }

      '<h1>找到屬於你的<br>心靈方向</h1>'+
      '<p>每個人面對人生的方式都不一樣。<br>有些人需要答案，有些人需要理解自己，<br>有些人只是想知道：「我現在到底怎麼了？」</p>'+
      '<p style="margin-top:12px">透過幾個簡單的直覺選擇，<br>彩之語陪你找到目前最適合自己的探索方向。</p>'+

  } else if(S.step>=1 && S.step<=20){
    var Q=QUESTIONS[S.step-1], pct=Math.round(S.step/20*100);
    html='<div class="bar"><i style="width:'+pct+'%"></i></div><div class="step-no">第 '+S.step+' / 20 步</div>'+
      '<div class="card fade"><div class="q">'+esc(Q.q)+'</div>'+
      Q.o.map(function(o,i){return '<button class="opt" data-ans="'+i+'">'+esc(o.t)+'</button>';}).join('')+'</div>';
  } else {

  app.innerHTML=html; bind();
}

function saveLead(){
  if(leadSaved||!curLead||!window.SUPA)return; leadSaved=true;
  try{fetch(SUPA.url+'/rest/v1/customers',{method:'POST',headers:{'apikey':SUPA.key,'Authorization':'Bearer '+SUPA.key,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({ref_code:curLead.ref,topic:curLead.topic,result_type:curLead.type,status:'新客'})});}catch(e){}
}

function bind(){
  var st=app.querySelector('#start'); if(st)st.onclick=function(){S.step=1;render();};
  app.querySelectorAll('[data-ans]').forEach(function(b){b.onclick=function(){chooseAns(b,parseInt(b.getAttribute('data-ans'),10));};});
  var rs=app.querySelector('#restart'); if(rs)rs.onclick=function(){S={step:0,answers:[]};leadSaved=false;curLead=null;render();};
  var pt=app.querySelector('#ptoggle'); if(pt)pt.onclick=function(){var p=app.querySelector('#policy');p.style.display=(p.style.display==='block'?'none':'block');};
  var lg=app.querySelector('#line-go');
  if(lg){
    var R=compute(); var ref=genRef();
    curLead={ref:ref,topic:R.type.dir,type:R.type.name}; leadSaved=false;
    var msg='我做完彩之語測驗了！我的類型是「'+R.type.name+'」，方向是「'+R.type.dir+'」。（代碼 '+ref+'）';
    lg.setAttribute('href','https://line.me/R/oaMessage/'+encodeURIComponent(CONFIG.lineOaId)+'/?'+encodeURIComponent(msg));
    lg.onclick=function(){saveLead();};
  }
  var sh=app.querySelector('#share'); if(sh)sh.onclick=function(){
    var R=compute(); var u=CONFIG.shareUrl||location.href;
    var m='我剛測完彩之語，我是「'+R.type.name+'」型！你也來找找你的心靈方向 → '+u;
    window.open('https://line.me/R/msg/text/?'+encodeURIComponent(m),'_blank');
  };
}

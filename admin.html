<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>後台管理｜彩之語 Rainbow Whisper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .admin-bar{position:sticky;top:0;z-index:40;background:rgba(250,244,230,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .admin-bar-in{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 18px 6px;gap:10px}
  .admin-title{font-family:"Noto Serif TC",serif;font-weight:600;color:var(--brush);font-size:18px}
  .abtn{font:inherit;font-size:13px;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--brush);cursor:pointer;text-decoration:none;display:inline-block}
  .abtn:hover{background:var(--tint)}
  .tabbar{max-width:960px;margin:0 auto;display:flex;gap:4px;padding:0 18px 10px;flex-wrap:wrap}
  .tabbar button{font:inherit;font-size:14px;color:var(--soft);background:none;border:none;padding:8px 14px;border-radius:999px;cursor:pointer}
  .tabbar button.on{background:var(--brush);color:#fff;font-weight:500}

  .wrap{max-width:960px;margin:0 auto;padding:18px 18px 60px}

  .login{max-width:340px;margin:9vh auto;padding:0 20px;text-align:center}
  .login .logo{width:64px;height:64px;border-radius:50%;margin:0 auto 16px;background:conic-gradient(from 200deg,#E8927C,#F0C66B,#9FD49A,#7FC8D9,#A99BE0,#E6A3C3,#E8927C);opacity:.9}
  .login h1{font-family:"Noto Serif TC",serif;font-size:20px;color:var(--brush);margin-bottom:4px}
  .login p{font-size:13px;color:var(--soft);margin-bottom:20px}
  .fld{width:100%;font:inherit;font-size:15px;color:var(--ink);background:#FBF6EC;border:1.5px solid #EFE3CE;border-radius:12px;padding:12px 15px;outline:none;margin-bottom:12px}
  .fld:focus{border-color:#C9A7DE}
  .login-btn{width:100%;font:inherit;font-weight:500;font-size:15px;color:#4A3A2A;background:var(--rainbow);border:none;border-radius:999px;padding:13px 0;cursor:pointer}
  .login-btn:disabled{opacity:.65}
  .err{color:#C0506A;font-size:13px;min-height:18px;margin-top:4px}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
  .filters input,.filters select{font:inherit;font-size:14px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;outline:none}
  .filters input{flex:1;min-width:150px}
  .filters input:focus,.filters select:focus{border-color:#C9A7DE}
  .count{font-size:13px;color:var(--soft);margin:6px 2px 12px}
  .sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .addbtn{font:inherit;font-size:14px;font-weight:500;color:#4A3A2A;background:var(--rainbow);border:none;border-radius:999px;padding:10px 20px;cursor:pointer}

  .cust{background:#FFFDF8;border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:12px}
  .cust-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .type-badge{display:inline-block;font-size:13px;font-weight:500;color:#6E4F9E;background:#EAD9F2;padding:3px 11px;border-radius:999px}
  .src-badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;margin-right:2px}
  .src-q{background:#E7EEF4;color:#5A7A94}
  .src-m{background:#D8ECDF;color:#3F7A5E}
  .topic{font-size:14px;color:var(--soft)}
  .meta{font-size:12px;color:#A9967E;white-space:nowrap}
  .cust-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cust label{display:flex;flex-direction:column;font-size:11.5px;color:var(--soft);gap:4px}
  .cust .in{font:inherit;font-size:14px;color:var(--ink);background:#FBF6EC;border:1.5px solid #EFE3CE;border-radius:9px;padding:8px 10px;outline:none}
  .cust .in:focus{border-color:#C9A7DE;background:#fff}
  .notes-l{margin-top:10px}
  .notes-l textarea,.notes-l input{width:100%}
  .notes-l textarea{min-height:44px;resize:vertical}
  .cust-actions{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:10px}
  .saved{font-size:12px}
  .del{font:inherit;font-size:12px;color:#B87;background:none;border:none;cursor:pointer;text-decoration:underline}
  .del:hover{color:#C0506A}
  .muted{color:var(--soft);font-size:14px}
  .soon{text-align:center;padding:50px 20px;color:var(--soft)}
  .soon h3{font-family:"Noto Serif TC",serif;font-size:17px;color:var(--brush);margin-bottom:8px}

  .summary{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-bottom:10px;padding:8px 12px;background:var(--tint);border-radius:10px}
  .summary b{color:var(--brush)}
  .rlink{font:inherit;font-size:12px;color:var(--brush);background:none;border:none;cursor:pointer;text-decoration:underline;padding:0}
  .records{margin-top:8px;font-size:13px}
  .rec{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px dashed var(--line)}
  .rec small{color:var(--soft)}
  .recdel{font:inherit;font-size:12px;color:#B87;background:none;border:none;cursor:pointer;margin-left:6px}
  .recdel:hover{color:#C0506A}
  .rp-h{font-family:"Noto Serif TC",serif;font-size:15px;color:var(--brush);margin:18px 0 10px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:10px}
  .stat{background:#FFFDF8;border:1px solid var(--line);border-radius:12px;padding:13px 14px}
  .stat .k{font-size:12px;color:var(--soft)}
  .stat .v{font-family:"Noto Serif TC",serif;font-size:19px;color:var(--brush);margin-top:3px}
  .in-sm{font:inherit;font-size:14px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:7px 10px;outline:none}
  .rptable{width:100%;border-collapse:collapse;font-size:14px}
  .rptable th,.rptable td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
  .rptable th{font-size:12px;color:var(--soft);font-weight:500}
  .rptable td.num,.rptable th.num{text-align:right;font-variant-numeric:tabular-nums}
  .gblock{background:#FFFDF8;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
  .gblock-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:8px;margin-bottom:4px;border-bottom:1px solid var(--line)}
  .gblock-head b{font-size:15px;color:var(--brush)}
  .gblock-head span{font-size:12.5px;color:var(--soft)}
  .gitem{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:7px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
  .gitem:last-child{border-bottom:none}
  .gd{color:var(--soft);white-space:nowrap;min-width:82px}
  .gn{min-width:56px;color:var(--ink)}
  .gs{flex:1;min-width:80px;color:var(--soft)}
  .ga{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--brush);font-weight:500}

  .formcard{background:#FFFDF8;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .formcard h3{font-family:"Noto Serif TC",serif;font-size:15px;color:var(--brush);margin-bottom:12px}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .fgrid label{display:flex;flex-direction:column;font-size:11.5px;color:var(--soft);gap:4px}
  .fgrid .in{font:inherit;font-size:14px;color:var(--ink);background:#FBF6EC;border:1.5px solid #EFE3CE;border-radius:9px;padding:8px 10px;outline:none}
  .fgrid .in:focus{border-color:#C9A7DE;background:#fff}
  .status-badge{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px}
  .st-book{background:#FBE7CC;color:#A5643A}
  .st-done{background:#D8ECDF;color:#3F7A5E}
  .st-cancel{background:#EDE6DC;color:#8A7659}
  .st-refund{background:#F3D9DE;color:#B5566E}
  @media(max-width:520px){ .cust-grid,.fgrid{grid-template-columns:1fr} }
</style>
</head>
<body>

<div id="login" class="login" style="display:none">
  <div class="logo"></div>
  <h1>後台管理</h1>
  <p>彩之語 · 請登入</p>
  <form id="login-form">
    <input class="fld" id="email" type="email" placeholder="Email" autocomplete="username">
    <input class="fld" id="password" type="password" placeholder="密碼" autocomplete="current-password">
    <button class="login-btn" id="login-btn" type="submit">登入</button>
    <div class="err" id="login-err"></div>
  </form>
</div>

<div id="app" style="display:none">
  <div class="admin-bar">
    <div class="admin-bar-in">
      <div class="admin-title">彩之語後台</div>
      <div style="display:flex;gap:8px">
        <a class="abtn" href="index.html">回網站</a>
        <button class="abtn" id="refresh">重新整理</button>
        <button class="abtn" id="logout">登出</button>
      </div>
    </div>
    <div class="tabbar">
      <button data-tab="customers" class="on">客戶管理</button>
      <button data-tab="guides">引路人管理</button>
      <button data-tab="tx">交易紀錄</button>
      <button data-tab="report">報表</button>
    </div>
  </div>

  <div class="wrap">
    <!-- 客戶管理 -->
    <section id="tab-customers">
      <div class="filters">
        <input id="search" placeholder="搜尋　稱呼／聯絡／代碼／備註…">
        <select id="f-source"><option value="">全部來源</option><option>測驗</option><option>會員</option></select>
        <select id="f-status"><option value="">全部狀態</option></select>
        <select id="f-type"><option value="">全部類型</option></select>
      </div>
      <div class="count" id="count"></div>
      <div id="list"></div>
    </section>

    <!-- 引路人管理 -->
    <section id="tab-guides" style="display:none">
      <div class="sec-head">
        <div class="count" id="gcount" style="margin:0"></div>
        <button class="addbtn" id="add-guide">＋ 新增引路人</button>
      </div>
      <div id="glist"></div>
    </section>

    <!-- 交易紀錄 -->
    <section id="tab-tx" style="display:none">
      <div class="formcard">
        <h3>新增交易（消費／預約）</h3>
        <div class="fgrid">
          <label>客戶 *<select class="in" id="tx-cust"></select></label>
          <label>引路人<select class="in" id="tx-guide"></select></label>
          <label>項目<input class="in" id="tx-service" placeholder="例：塔羅 60 分"></label>
          <label>預約／服務時間<input class="in" id="tx-when" type="datetime-local"></label>
          <label>金額 *<input class="in" id="tx-amount" type="number" min="0" placeholder="0"></label>
          <label>付款方式<select class="in" id="tx-method"><option>現金</option><option>刷卡</option><option>匯款</option><option>儲值</option></select></label>
          <label>狀態<select class="in" id="tx-status"><option>已預約</option><option>已完成</option><option>已取消</option><option>已退費</option></select></label>
          <label>備註<input class="in" id="tx-notes" placeholder="選填"></label>
        </div>
        <button class="addbtn" id="tx-add">新增交易</button>
        <span class="saved" id="tx-msg" style="margin-left:10px"></span>
      </div>

      <div class="formcard">
        <h3>新增儲值</h3>
        <div class="fgrid">
          <label>客戶 *<select class="in" id="tp-cust"></select></label>
          <label>日期<input class="in" id="tp-date" type="date"></label>
          <label>金額 *<input class="in" id="tp-amount" type="number" min="0" placeholder="0"></label>
          <label>方式<select class="in" id="tp-method"><option>現金</option><option>刷卡</option><option>匯款</option></select></label>
          <label>備註<input class="in" id="tp-notes" placeholder="選填"></label>
        </div>
        <button class="addbtn" id="tp-add">新增儲值</button>
        <span class="saved" id="tp-msg" style="margin-left:10px"></span>
      </div>

      <div class="filters">
        <input id="tx-search" placeholder="搜尋　客戶／引路人／項目／備註…">
        <select id="tx-fstatus"><option value="">全部狀態</option><option>已預約</option><option>已完成</option><option>已取消</option><option>已退費</option></select>
        <select id="tx-fguide"><option value="">全部引路人</option></select>
      </div>
      <div class="count" id="txcount"></div>
      <div id="txlist"></div>
    </section>

    <!-- 報表 -->
    <section id="tab-report" style="display:none">
      <div class="filters" style="align-items:center">
        <span style="font-size:13px;color:var(--soft)">日期範圍</span>
        <input id="rp-from" type="date" class="in-sm" style="flex:none">
        <span style="color:var(--soft)">~</span>
        <input id="rp-to" type="date" class="in-sm" style="flex:none">
        <button class="abtn" id="rp-clear">全部</button>
      </div>
      <div id="rp-summary"></div>
      <h3 class="rp-h">每位引路人業績</h3>
      <div id="rp-guides"></div>
    </section>
  </div>
</div>

<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var db = supabase.createClient(window.SUPA.url, window.SUPA.key);
var TYPES=['策士','叩問','穩步','靜思','燈塔','破繭','暖光','歸心'];
var STATUSES=['新客','已加LINE','已諮詢','回頭客'];
var ALL=[], GUIDES=[], TX=[], TOPUPS=[], activeTab='customers';
function $(s){return document.querySelector(s);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});}
function fmtDate(s){if(!s)return '';var d=new Date(s);return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function fmtDay(s){if(!s)return '';var d=new Date(s);return (d.getMonth()+1)+'/'+d.getDate();}
function fmtFull(s){if(!s)return '未定時間';var d=new Date(s);return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate();}
function money(n){return '$'+Number(n||0).toLocaleString();}
function custLabel(c){return c.name || c.contact || (c.ref_code?('代碼'+c.ref_code):'') || '(無名客戶)';}
function guideLabel(g){return g.name || '(未命名引路人)';}
function custById(id){return ALL.find(function(x){return x.id===id;});}
function guideById(id){return GUIDES.find(function(x){return x.id===id;});}

STATUSES.forEach(function(s){$('#f-status').insertAdjacentHTML('beforeend','<option>'+s+'</option>');});
TYPES.forEach(function(t){$('#f-type').insertAdjacentHTML('beforeend','<option>'+t+'</option>');});

function showLogin(){$('#login').style.display='block';$('#app').style.display='none';}
function showApp(){$('#login').style.display='none';$('#app').style.display='block';}

async function init(){
  var r=await db.auth.getSession();
  if(r.data && r.data.session){ showApp(); loadAll(); } else { showLogin(); }
}
$('#login-form').onsubmit=async function(e){
  e.preventDefault();
  var email=$('#email').value.trim(), pw=$('#password').value;
  var btn=$('#login-btn'); btn.disabled=true; btn.textContent='登入中…';
  var r=await db.auth.signInWithPassword({email:email,password:pw});
  btn.disabled=false; btn.textContent='登入';
  if(r.error){ $('#login-err').textContent='登入失敗：'+r.error.message; return; }
  $('#login-err').textContent=''; showApp(); loadAll();
};
$('#logout').onclick=async function(){ await db.auth.signOut(); showLogin(); };
$('#refresh').onclick=function(){ loadAll(); };

document.querySelectorAll('.tabbar button').forEach(function(b){
  b.onclick=function(){
    var t=b.getAttribute('data-tab'); activeTab=t;
    ['customers','guides','tx','report'].forEach(function(x){
      document.getElementById('tab-'+x).style.display=(x===t?'block':'none');
      document.querySelector('.tabbar [data-tab="'+x+'"]').classList.toggle('on',x===t);
    });
    if(t==='report') renderReport();
  };
});

async function loadAll(){
  $('#list').innerHTML='<div class="muted" style="padding:24px;text-align:center">載入中…</div>';
  var res=await Promise.all([
    db.from('customers').select('*').order('created_at',{ascending:false}),
    db.from('guides').select('*').order('created_at',{ascending:false}),
    db.from('transactions').select('*').order('created_at',{ascending:false}),
    db.from('topups').select('*').order('created_at',{ascending:false})
  ]);
  ALL=res[0].data||[]; GUIDES=res[1].data||[]; TX=res[2].data||[]; TOPUPS=res[3].data||[];
  var err=res.find(function(x){return x.error;});
  if(err){ $('#list').innerHTML='<div class="muted">讀取失敗：'+esc(err.error.message)+'（三張新表若尚未建立，請先跑建表 SQL）</div>'; }
  fillSelects();
  try{ if(!$('#tp-date').value) $('#tp-date').value=new Date().toISOString().slice(0,10); }catch(e){}
  render(); renderGuides(); renderTx(); renderReport();
}

/* ===== 金額彙總 ===== */
function custAgg(cid){
  var topup=0, used=0, spent=0;
  TOPUPS.forEach(function(t){ if(t.customer_id===cid) topup+=Number(t.amount||0); });
  TX.forEach(function(t){
    if(t.customer_id!==cid) return;
    if(t.status==='已取消'||t.status==='已退費') return;
    spent+=Number(t.amount||0);
    if(t.method==='儲值') used+=Number(t.amount||0);
  });
  return {balance:topup-used, spent:spent, topup:topup};
}

/* ===== 客戶管理 ===== */
function render(){
  var q=$('#search').value.trim().toLowerCase();
  var fs=$('#f-status').value, ft=$('#f-type').value, fsrc=$('#f-source').value;
  var rows=ALL.filter(function(c){
    if(fs && c.status!==fs) return false;
    if(ft && c.result_type!==ft) return false;
    if(fsrc && (c.source||'測驗')!==fsrc) return false;
    if(q){ var hay=[c.ref_code,c.name,c.contact,c.notes,c.topic,c.result_type,(c.tags||[]).join(' ')].join(' ').toLowerCase(); if(hay.indexOf(q)<0) return false; }
    return true;
  });
  $('#count').textContent='共 '+ALL.length+' 位，顯示 '+rows.length+' 位';
  if(!rows.length){ $('#list').innerHTML='<div class="muted" style="padding:30px;text-align:center">沒有符合的客戶</div>'; return; }
  $('#list').innerHTML=rows.map(card).join('');
  bindCards();
}
function customerRecords(cid){
  var txs=TX.filter(function(t){return t.customer_id===cid;});
  var tps=TOPUPS.filter(function(t){return t.customer_id===cid;});
  if(!txs.length && !tps.length) return '<div class="muted" style="padding:6px 0">尚無消費／儲值紀錄</div>';
  var h='';
  txs.forEach(function(t){ h+='<div class="rec"><span><small>'+fmtDay(t.appointment_at||t.created_at)+'</small>　消費　'+esc(t.service||'—')+'　<small>'+esc(guideName(t.guide_id))+'</small></span><span>'+money(t.amount)+'　'+statusBadge(t.status)+'<button class="recdel" data-deltx="'+t.id+'" title="刪除">✕</button></span></div>'; });
  tps.forEach(function(t){ h+='<div class="rec"><span><small>'+fmtDay(t.created_at)+'</small>　儲值　<small>'+esc(t.method||'')+'</small></span><span style="color:#3F7A5E">+'+money(t.amount)+'<button class="recdel" data-deltp="'+t.id+'" title="刪除">✕</button></span></div>'; });
  return h;
}
function card(c){
  var a=custAgg(c.id);
  return '<div class="cust" data-id="'+c.id+'">'+
    '<div class="cust-top">'+
      '<div><span class="src-badge '+(c.source==='會員'?'src-m':'src-q')+'">'+esc(c.source||'測驗')+'</span> <span class="type-badge">'+esc(c.result_type||'—')+'</span> <span class="topic">'+esc(c.topic||'')+'</span></div>'+
      '<div class="meta">'+fmtDate(c.created_at)+'　代碼 '+esc(c.ref_code||'—')+'</div>'+
    '</div>'+
    '<div class="summary"><span>餘額 <b>'+money(a.balance)+'</b></span><span>累積消費 <b>'+money(a.spent)+'</b></span><span>儲值 <b>'+money(a.topup)+'</b></span><button class="rlink" data-rec>查看紀錄</button></div>'+
    '<div class="records" data-recbox style="display:none">'+customerRecords(c.id)+'</div>'+
    '<div class="cust-grid">'+
      '<label>稱呼<input class="in" data-f="name" value="'+esc(c.name)+'" placeholder="—"></label>'+
      '<label>聯絡（LINE／電話）<input class="in" data-f="contact" value="'+esc(c.contact)+'" placeholder="—"></label>'+
      '<label>狀態<select class="in" data-f="status">'+STATUSES.map(function(s){return '<option'+(c.status===s?' selected':'')+'>'+s+'</option>';}).join('')+'</select></label>'+
      '<label>標籤（逗號分隔）<input class="in" data-f="tags" value="'+esc((c.tags||[]).join(', '))+'" placeholder="例：高意願, 感情"></label>'+
    '</div>'+
    '<label class="notes-l">備註<textarea class="in" data-f="notes" placeholder="記點什麼…">'+esc(c.notes)+'</textarea></label>'+
    '<div class="cust-actions"><span class="saved" data-saved></span><button class="del" data-del>刪除</button></div>'+
  '</div>';
}
function bindCards(){
  document.querySelectorAll('#list .cust').forEach(function(el){
    var id=el.getAttribute('data-id');
    var rb=el.querySelector('[data-rec]'); if(rb) rb.onclick=function(){ var box=el.querySelector('[data-recbox]'); box.style.display=(box.style.display==='none'?'block':'none'); };
    el.querySelectorAll('[data-deltp]').forEach(function(btn){ btn.onclick=async function(){ if(!confirm('確定刪除這筆儲值？餘額會重新計算。'))return; var tid=btn.getAttribute('data-deltp'); var r=await db.from('topups').delete().eq('id',tid); if(r.error){ alert('刪除失敗：'+r.error.message); return; } TOPUPS=TOPUPS.filter(function(x){return x.id!==tid;}); render(); }; });
    el.querySelectorAll('[data-deltx]').forEach(function(btn){ btn.onclick=async function(){ if(!confirm('確定刪除這筆消費紀錄？'))return; var tid=btn.getAttribute('data-deltx'); var r=await db.from('transactions').delete().eq('id',tid); if(r.error){ alert('刪除失敗：'+r.error.message); return; } TX=TX.filter(function(x){return x.id!==tid;}); render(); renderTx(); }; });
    el.querySelectorAll('[data-f]').forEach(function(inp){
      inp.addEventListener('change',async function(){
        var f=inp.getAttribute('data-f'), val=inp.value;
        if(f==='tags'){ val=val.split(/[,，、]/).map(function(s){return s.trim();}).filter(Boolean); }
        var patch={}; patch[f]=val;
        var s=el.querySelector('[data-saved]'); s.textContent='儲存中…'; s.style.color='var(--soft)';
        var r=await db.from('customers').update(patch).eq('id',id);
        if(r.error){ s.textContent='存檔失敗'; s.style.color='#C0506A'; }
        else{ s.textContent='已儲存'; s.style.color='#4F8E6E'; var c=custById(id); if(c)c[f]=val; setTimeout(function(){s.textContent='';},1400); }
      });
    });
    el.querySelector('[data-del]').onclick=async function(){
      if(!confirm('確定刪除這位客戶的資料？無法復原。'))return;
      var r=await db.from('customers').delete().eq('id',id);
      if(r.error){ alert('刪除失敗：'+r.error.message); return; }
      ALL=ALL.filter(function(x){return x.id!==id;}); render();
    };
  });
}
['search','f-source','f-status','f-type'].forEach(function(id){ var e=document.getElementById(id); e.addEventListener('input',render); e.addEventListener('change',render); });

/* ===== 引路人管理 ===== */
function guideName(id){ var g=guideById(id); return g?guideLabel(g):(id?'(已刪引路人)':'—'); }
function renderGuides(){
  $('#gcount').textContent='共 '+GUIDES.length+' 位引路人';
  if(!GUIDES.length){ $('#glist').innerHTML='<div class="muted" style="padding:30px;text-align:center">還沒有引路人。按右上角「＋ 新增引路人」建立第一位。</div>'; return; }
  $('#glist').innerHTML=GUIDES.map(guideCard).join('');
  bindGuides();
}
function guideCard(g){
  return '<div class="cust" data-id="'+g.id+'">'+
    '<div class="cust-grid">'+
      '<label>姓名<input class="in" data-f="name" value="'+esc(g.name)+'" placeholder="引路人姓名"></label>'+
      '<label>電話<input class="in" data-f="phone" value="'+esc(g.phone)+'" placeholder="09__ ___ ___"></label>'+
      '<label>信箱<input class="in" data-f="email" value="'+esc(g.email)+'" placeholder="you@mail.com"></label>'+
      '<label>可預約時間<input class="in" data-f="availability" value="'+esc(g.availability)+'" placeholder="例：週一~五 晚上"></label>'+
    '</div>'+
    '<label class="notes-l">服務項目（逗號分隔）<input class="in" data-f="services" value="'+esc((g.services||[]).join(', '))+'" placeholder="例：塔羅, 占星, 八字"></label>'+
    '<label class="notes-l">備註<textarea class="in" data-f="notes" placeholder="收費、經歷等…">'+esc(g.notes)+'</textarea></label>'+
    '<div class="cust-actions">'+
      '<label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--soft);margin-right:auto;cursor:pointer"><input type="checkbox" data-f="active" '+(g.active?'checked':'')+'> 啟用中</label>'+
      '<span class="saved" data-saved></span><button class="del" data-del>刪除</button>'+
    '</div>'+
  '</div>';
}
function bindGuides(){
  document.querySelectorAll('#glist .cust').forEach(function(el){
    var id=el.getAttribute('data-id');
    el.querySelectorAll('[data-f]').forEach(function(inp){
      inp.addEventListener('change',async function(){
        var f=inp.getAttribute('data-f'), val;
        if(f==='active'){ val=inp.checked; }
        else if(f==='services'){ val=inp.value.split(/[,，、]/).map(function(s){return s.trim();}).filter(Boolean); }
        else { val=inp.value; }
        var patch={}; patch[f]=val;
        var s=el.querySelector('[data-saved]'); s.textContent='儲存中…'; s.style.color='var(--soft)';
        var r=await db.from('guides').update(patch).eq('id',id);
        if(r.error){ s.textContent='存檔失敗'; s.style.color='#C0506A'; }
        else{ s.textContent='已儲存'; s.style.color='#4F8E6E'; var g=guideById(id); if(g)g[f]=val; if(f==='name'){fillSelects();renderTx();} setTimeout(function(){s.textContent='';},1400); }
      });
    });
    el.querySelector('[data-del]').onclick=async function(){
      if(!confirm('確定刪除這位引路人？'))return;
      var r=await db.from('guides').delete().eq('id',id);
      if(r.error){ alert('刪除失敗：'+r.error.message); return; }
      GUIDES=GUIDES.filter(function(x){return x.id!==id;}); renderGuides(); fillSelects();
    };
  });
}
$('#add-guide').onclick=async function(){
  var r=await db.from('guides').insert({name:'',active:true});
  if(r.error){ alert('新增失敗：'+r.error.message); return; }
  await loadAll(); document.querySelector('.tabbar [data-tab="guides"]').click();
};

/* ===== 交易紀錄 ＋ 儲值 ===== */
function fillSelects(){
  var copt='<option value="">— 選擇客戶 —</option>'+ALL.map(function(c){return '<option value="'+c.id+'">'+esc(custLabel(c))+'</option>';}).join('');
  $('#tx-cust').innerHTML=copt; $('#tp-cust').innerHTML=copt;
  $('#tx-guide').innerHTML='<option value="">（無指定）</option>'+GUIDES.map(function(g){return '<option value="'+g.id+'">'+esc(guideLabel(g))+'</option>';}).join('');
  $('#tx-fguide').innerHTML='<option value="">全部引路人</option>'+GUIDES.map(function(g){return '<option value="'+g.id+'">'+esc(guideLabel(g))+'</option>';}).join('');
}
function statusBadge(st){
  var cls=st==='已完成'?'st-done':st==='已取消'?'st-cancel':st==='已退費'?'st-refund':'st-book';
  return '<span class="status-badge '+cls+'">'+esc(st||'—')+'</span>';
}
$('#tx-add').onclick=async function(){
  var cid=$('#tx-cust').value, amt=$('#tx-amount').value;
  var msg=$('#tx-msg');
  if(!cid){ msg.textContent='請先選客戶'; msg.style.color='#C0506A'; return; }
  if(amt===''){ msg.textContent='請填金額'; msg.style.color='#C0506A'; return; }
  var row={customer_id:cid, guide_id:$('#tx-guide').value||null, service:$('#tx-service').value||null, appointment_at:$('#tx-when').value||null, amount:Number(amt)||0, method:$('#tx-method').value, status:$('#tx-status').value, notes:$('#tx-notes').value||null};
  msg.textContent='新增中…'; msg.style.color='var(--soft)';
  var r=await db.from('transactions').insert(row);
  if(r.error){ msg.textContent='失敗：'+r.error.message; msg.style.color='#C0506A'; return; }
  msg.textContent='已新增'; msg.style.color='#4F8E6E'; setTimeout(function(){msg.textContent='';},1500);
  $('#tx-service').value=''; $('#tx-when').value=''; $('#tx-amount').value=''; $('#tx-notes').value='';
  var rr=await db.from('transactions').select('*').order('created_at',{ascending:false}); TX=rr.data||[]; renderTx(); render();
};
$('#tp-add').onclick=async function(){
  var cid=$('#tp-cust').value, amt=$('#tp-amount').value;
  var msg=$('#tp-msg');
  if(!cid){ msg.textContent='請先選客戶'; msg.style.color='#C0506A'; return; }
  if(amt===''){ msg.textContent='請填金額'; msg.style.color='#C0506A'; return; }
  msg.textContent='新增中…'; msg.style.color='var(--soft)';
  var trow={customer_id:cid, amount:Number(amt)||0, method:$('#tp-method').value, notes:$('#tp-notes').value||null};
  var td=$('#tp-date').value; if(td){ trow.created_at=td; }
  var r=await db.from('topups').insert(trow);
  if(r.error){ msg.textContent='失敗：'+r.error.message; msg.style.color='#C0506A'; return; }
  msg.textContent='已儲值'; msg.style.color='#4F8E6E'; setTimeout(function(){msg.textContent='';},1500);
  $('#tp-amount').value=''; $('#tp-notes').value='';
  var rr=await db.from('topups').select('*').order('created_at',{ascending:false}); TOPUPS=rr.data||[]; render();
};
function renderTx(){
  var q=$('#tx-search').value.trim().toLowerCase();
  var fs=$('#tx-fstatus').value, fg=$('#tx-fguide').value;
  var rows=TX.filter(function(t){
    if(fs && t.status!==fs) return false;
    if(fg && t.guide_id!==fg) return false;
    if(q){ var c=custById(t.customer_id); var hay=[(c?custLabel(c):''),guideName(t.guide_id),t.service,t.notes].join(' ').toLowerCase(); if(hay.indexOf(q)<0) return false; }
    return true;
  });
  var sum=rows.reduce(function(a,t){return a+(t.status==='已取消'||t.status==='已退費'?0:Number(t.amount||0));},0);
  $('#txcount').textContent='顯示 '+rows.length+' 筆，有效金額合計 '+money(sum);
  if(!rows.length){ $('#txlist').innerHTML='<div class="muted" style="padding:24px;text-align:center">尚無交易，用上面表單新增</div>'; return; }
  $('#txlist').innerHTML=rows.map(txRow).join('');
  bindTx();
}
function txRow(t){
  var c=custById(t.customer_id);
  return '<div class="cust" data-id="'+t.id+'">'+
    '<div class="cust-top">'+
      '<div><b>'+esc(c?custLabel(c):'(已刪客戶)')+'</b>　<span class="topic">'+esc(guideName(t.guide_id))+'</span></div>'+
      '<div class="meta">'+(t.appointment_at?fmtDate(t.appointment_at):'未定時間')+'</div>'+
    '</div>'+
    '<div class="cust-grid">'+
      '<label>項目<input class="in" data-f="service" value="'+esc(t.service)+'"></label>'+
      '<label>金額<input class="in" data-f="amount" type="number" value="'+esc(t.amount)+'"></label>'+
      '<label>付款方式<select class="in" data-f="method">'+['現金','刷卡','匯款','儲值'].map(function(m){return '<option'+(t.method===m?' selected':'')+'>'+m+'</option>';}).join('')+'</select></label>'+
      '<label>狀態<select class="in" data-f="status">'+['已預約','已完成','已取消','已退費'].map(function(s){return '<option'+(t.status===s?' selected':'')+'>'+s+'</option>';}).join('')+'</select></label>'+
    '</div>'+
    '<label class="notes-l">備註<input class="in" data-f="notes" value="'+esc(t.notes)+'"></label>'+
    '<div class="cust-actions">'+statusBadge(t.status)+'<span class="saved" data-saved></span><button class="del" data-del>刪除</button></div>'+
  '</div>';
}
function bindTx(){
  document.querySelectorAll('#txlist .cust').forEach(function(el){
    var id=el.getAttribute('data-id');
    el.querySelectorAll('[data-f]').forEach(function(inp){
      inp.addEventListener('change',async function(){
        var f=inp.getAttribute('data-f'), val=inp.value;
        if(f==='amount'){ val=Number(val)||0; }
        var patch={}; patch[f]=val;
        var s=el.querySelector('[data-saved]'); s.textContent='儲存中…'; s.style.color='var(--soft)';
        var r=await db.from('transactions').update(patch).eq('id',id);
        if(r.error){ s.textContent='存檔失敗'; s.style.color='#C0506A'; }
        else{ s.textContent='已儲存'; s.style.color='#4F8E6E'; var t=TX.find(function(x){return x.id===id;}); if(t)t[f]=val; if(f==='status'||f==='amount'||f==='method'){ renderTx(); render(); } setTimeout(function(){s.textContent='';},1200); }
      });
    });
    el.querySelector('[data-del]').onclick=async function(){
      if(!confirm('確定刪除這筆交易？'))return;
      var r=await db.from('transactions').delete().eq('id',id);
      if(r.error){ alert('刪除失敗：'+r.error.message); return; }
      TX=TX.filter(function(x){return x.id!==id;}); renderTx(); render();
    };
  });
}
['tx-search','tx-fstatus','tx-fguide'].forEach(function(id){ var e=document.getElementById(id); e.addEventListener('input',renderTx); e.addEventListener('change',renderTx); });

/* ===== 報表 ===== */
function stat(k,v){ return '<div class="stat"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'; }
function inRange(dstr){
  var from=$('#rp-from').value, to=$('#rp-to').value;
  if(!from && !to) return true;
  if(!dstr) return false;
  var d=new Date(dstr);
  if(from && d < new Date(from+'T00:00:00')) return false;
  if(to && d > new Date(to+'T23:59:59')) return false;
  return true;
}
function renderReport(){
  var rows=TX.filter(function(t){ return inRange(t.appointment_at||t.created_at); });
  var valid=rows.filter(function(t){ return t.status!=='已取消'&&t.status!=='已退費'; });
  var refunds=rows.filter(function(t){ return t.status==='已退費'; });
  var byM={現金:0,刷卡:0,匯款:0,儲值:0}, total=0;
  valid.forEach(function(t){ var a=Number(t.amount||0); total+=a; if(byM[t.method]!==undefined) byM[t.method]+=a; });
  var refundAmt=refunds.reduce(function(a,t){return a+Number(t.amount||0);},0);
  var topupIn=TOPUPS.filter(function(t){return inRange(t.created_at);}).reduce(function(a,t){return a+Number(t.amount||0);},0);
  $('#rp-summary').innerHTML=
    '<div class="stats">'+stat('有效營收',money(total))+stat('交易筆數',valid.length+' 筆')+stat('退費',refunds.length+' 筆／'+money(refundAmt))+stat('儲值收入',money(topupIn))+'</div>'+
    '<div class="stats">'+stat('現金',money(byM.現金))+stat('刷卡',money(byM.刷卡))+stat('匯款',money(byM.匯款))+stat('儲值折抵',money(byM.儲值))+'</div>';
  var g={};
  rows.forEach(function(t){
    var k=t.guide_id||'__none__';
    if(!g[k]) g[k]={items:[],count:0,amount:0,refund:0};
    g[k].items.push(t);
    if(t.status==='已退費'){ g[k].refund+=Number(t.amount||0); }
    else if(t.status!=='已取消'){ g[k].count++; g[k].amount+=Number(t.amount||0); }
  });
  var keys=Object.keys(g).sort(function(a,b){return g[b].amount-g[a].amount;});
  if(!keys.length){ $('#rp-guides').innerHTML='<div class="muted" style="padding:20px;text-align:center">此範圍沒有交易</div>'; return; }
  var h='';
  keys.forEach(function(k){
    var gg=g[k], name=k==='__none__'?'（未指定引路人）':guideName(k);
    h+='<div class="gblock"><div class="gblock-head"><b>'+esc(name)+'</b><span>'+gg.count+' 筆　有效 '+money(gg.amount)+(gg.refund?'　退費 '+money(gg.refund):'')+'</span></div>';
    gg.items.sort(function(a,b){ return new Date(b.appointment_at||b.created_at) - new Date(a.appointment_at||a.created_at); });
    gg.items.forEach(function(t){
      var c=custById(t.customer_id);
      h+='<div class="gitem"><span class="gd">'+fmtFull(t.appointment_at||t.created_at)+'</span><span class="gn">'+esc(c?custLabel(c):'(客戶)')+'</span><span class="gs">'+esc(t.service||'—')+'</span><span class="ga">'+money(t.amount)+'</span>'+statusBadge(t.status)+'</div>';
    });
    h+='</div>';
  });
  $('#rp-guides').innerHTML=h;
}
['rp-from','rp-to'].forEach(function(id){ var e=document.getElementById(id); if(e) e.addEventListener('change',renderReport); });
var rpc=document.getElementById('rp-clear'); if(rpc) rpc.onclick=function(){ $('#rp-from').value=''; $('#rp-to').value=''; renderReport(); };

init();
</script>

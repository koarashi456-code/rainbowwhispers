<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --brand:#6B4A33; --brand-deep:#5A4632; --accent:#B5713F;
    --bg:#FAF4E6; --card:#FFFDF8; --ink:#5A4632; --ink-soft:#8A7659;
    --line:#ECDFC6; --tint:#F4EAD4; --teal:#3E9E86;
    --radius:16px; --radius-sm:12px;
  }
  body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
  .wrap{max-width:520px;margin:0 auto;padding:28px 18px 40px}
  .serif{font-family:"Noto Serif TC",serif}
  .intro{text-align:center;margin:6px 0 22px}
  .intro h1{font-size:26px;font-weight:600;color:var(--brand-deep);margin-bottom:8px}
  .intro p{color:var(--ink-soft);font-size:15px}
  .bar{height:5px;border-radius:999px;background:var(--tint);overflow:hidden;margin-bottom:14px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,#EE9E86,#F2C56E,#9FD49A,#86C9DA,#B0A2E4);border-radius:999px;transition:width .4s ease}
  .step-no{color:var(--ink-soft);font-size:13px;letter-spacing:.04em;margin-bottom:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px 24px;box-shadow:0 8px 30px -18px rgba(120,90,60,.28)}
  .q{font-size:19px;font-weight:500;line-height:1.55;margin-bottom:6px}
  .opt{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:15px 18px;margin-top:12px;cursor:pointer;transition:all .18s ease}
  .opt:hover{border-color:var(--brand);background:var(--tint)}
  .opt.sel{border-color:var(--brand);background:var(--brand);color:#fff}
  .topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px;margin-top:18px}
  .topic{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:18px 10px;font-weight:500}
  .topic svg{width:28px;height:28px;color:var(--brand)}
  .topic.sel svg{color:#fff}
  .res-kicker{color:var(--ink-soft);font-size:13px;letter-spacing:.08em}
  .res-name{font-size:30px;font-weight:600;color:var(--brand-deep);margin:6px 0 2px}
  .res-combo{color:var(--accent);font-weight:500;font-size:14px;letter-spacing:.04em;margin-bottom:14px}
  .res-body{font-size:15.5px;margin-bottom:16px}
  .pill{display:inline-block;font-size:13px;padding:5px 13px;border-radius:999px;margin:0 7px 7px 0;background:var(--tint);color:var(--brand-deep)}
  .pill1{background:#D8ECDF;color:#3F7A5E}.pill2{background:#FBE0CC;color:#A5643A}.pill3{background:#E7DBF4;color:#6E4F9E}
  .note{background:var(--bg);border-radius:var(--radius-sm);padding:14px 16px;margin-top:16px}
  .note .lbl{color:var(--ink-soft);font-size:13px;margin-bottom:4px}
  .note p{font-size:14.5px;line-height:1.65}
  .lead{margin-top:14px}
  .lead h3{font-size:17px;font-weight:500;margin-bottom:4px}
  .lead .sub{color:var(--ink-soft);font-size:14px;margin-bottom:14px}
  .lead-row{display:flex;gap:10px}
  .consent{display:flex;align-items:flex-start;gap:8px;margin-top:12px;font-size:13px;color:var(--ink-soft);line-height:1.55;cursor:pointer}
  .consent input{margin-top:3px;width:16px;height:16px;flex:none;accent-color:var(--brand)}
  .consent a{color:var(--brand-deep);text-decoration:underline}
  .consent.warn{color:#C0506A}
  .policy{display:none;margin-top:10px;padding:13px 15px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);font-size:12.5px;line-height:1.75}
  .policy.open{display:block}
  .policy h4{font-size:13px;font-weight:500;margin-bottom:6px;color:var(--brand-deep)}
  .policy b{font-weight:500;color:var(--ink)}
  .lead input{flex:1;font:inherit;padding:13px 15px;border:1.5px solid var(--line);border-radius:var(--radius-sm);outline:none;transition:border-color .18s}
  .lead input:focus{border-color:var(--brand)}
  .btn-primary{font:inherit;font-weight:500;color:#4A3A2A;background:linear-gradient(95deg,#EE9E86,#F2C56E,#9FD49A,#86C9DA,#B0A2E4);border:none;border-radius:var(--radius-sm);padding:0 22px;cursor:pointer;white-space:nowrap;transition:filter .18s}
  .btn-primary:hover{filter:brightness(.96)}
  .btn-block{display:block;width:100%;text-align:center;padding:14px 0;text-decoration:none}
  .btn-member{font:inherit;font-weight:500;color:#fff;background:var(--brand);border:none;border-radius:var(--radius-sm);transition:filter .18s}
  .btn-member:hover{filter:brightness(1.1)}
  .lead-mini{font-size:12px;color:var(--ink-soft);margin-top:10px;line-height:1.6}
  .lead-mini a{color:var(--brand-deep);text-decoration:underline;cursor:pointer}
  .ok{color:var(--teal);font-size:15px;font-weight:500;display:flex;align-items:center;gap:7px}
  .ok svg{width:20px;height:20px}
  .actions{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
  .btn-ghost{font:inherit;color:var(--ink-soft);background:none;border:1px solid var(--line);border-radius:999px;padding:9px 18px;cursor:pointer;transition:all .18s}
  .btn-ghost:hover{color:var(--brand-deep);border-color:var(--brand)}
  .btn-line{font:inherit;font-weight:500;color:#fff;background:#06C755;border:none;border-radius:999px;padding:9px 20px;cursor:pointer;transition:filter .18s}
  .btn-line:hover{filter:brightness(.95)}
  .foot{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-soft);line-height:1.75;text-align:center}
  .fade{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media(max-width:380px){.wrap{padding:20px 14px 32px}.card{padding:22px 18px}.res-name{font-size:26px}}
</style>

function chooseTopic(el,k){ if(locked)return; locked=true; el.classList.add('sel');
  setTimeout(function(){S.topic=k;S.step=1;locked=false;render();},170); }
function chooseAns(el,idx){ if(locked)return; locked=true; el.classList.add('sel');
  setTimeout(function(){var e=QUESTIONS[S.step-1].opts[idx].e;
    for(var k in e)S[k]+=e[k];S.step++;locked=false;render();},170); }

function submitLead(payload,onDone){
  var cfg=CONFIG.googleFormAction;
  if(!cfg){ onDone(); return; }
  var fd=new FormData();
  fd.append(CONFIG.googleEntries.contact,payload.contact);
  fd.append(CONFIG.googleEntries.type,payload.type);
  fd.append(CONFIG.googleEntries.topic,payload.topic);
  fetch(cfg,{method:'POST',mode:'no-cors',body:fd}).then(onDone,onDone);
}

         '<div class="card fade"><div class="q">你現在最想被好好陪伴的，是哪一塊？</div>'+
         '<div class="topics">'+TOPICS.map(function(t){
            return '<button class="opt topic" data-topic="'+t.key+'">'+svg(ICONS[t.key])+t.label+'</button>';
         }).join('')+'</div></div>';
  } else if(S.step>=1 && S.step<=6){
    var Q=QUESTIONS[S.step-1],n=S.step+1,pct=Math.round(n/7*100);
    html='<div class="bar"><i style="width:'+pct+'%"></i></div>'+
         '<div class="step-no">第 '+n+' / 7 步</div>'+
         '<div class="card fade"><div class="q">'+Q.q+'</div>'+
         Q.opts.map(function(o,i){return '<button class="opt" data-ans="'+i+'">'+o.t+'</button>';}).join('')+
         '</div>';
  } else {
    var key=(S.a1<0?'R':'E')+(S.a2<0?'D':'G')+(S.a3<0?'I':'S');
    var T=TYPES[key];
    var p1=S.a1>0?'情感共鳴':S.a1<0?'理性分析':'理性 × 感性';
    var p2=S.a2>0?'溫柔陪伴':S.a2<0?'真誠直接':'剛柔並濟';
    var p3=S.a3>0?'引導自悟':S.a3<0?'明確指引':'方向 × 啟發';
    var policyLink = CONFIG.privacyUrl
      ? '<a href="'+CONFIG.privacyUrl+'" target="_blank" rel="noopener">隱私權政策</a>'
      : '<a id="policy-toggle" style="cursor:pointer">《個資使用告知》</a>';
    var policyBox = CONFIG.privacyUrl ? '' : '<div class="policy" id="policy">'+policyMarkup()+'</div>';
    var leadMode = CONFIG.googleFormAction ? 'form' : (CONFIG.lineUrl ? 'line' : 'demo');
    var leadHtml;
    if(leadMode==='line'){
      var lineMsg='我做完彩之語測驗了！我的相處頻率是「'+T.name+'（'+T.combo+'）」，最在意的是「'+tLabel(S.topic)+'」。';
      var lineHref,lineBtnTxt,lineMini;
      if(CONFIG.lineOaId){
        lineHref='https://line.me/R/oaMessage/'+encodeURIComponent(CONFIG.lineOaId)+'/?'+encodeURIComponent(lineMsg);
        lineBtnTxt='加入 LINE 並送出我的結果　→';
        lineMini='送出後我們會收到你的相處頻率，為你配對最適合的引路人。查看'+policyLink;
      } else {
        lineHref=CONFIG.lineUrl;
        lineBtnTxt='加入 LINE，領取你的配對　→';
        lineMini='點擊將前往彩之語官方 LINE。查看'+policyLink;
      }
      leadHtml='<div class="lead"><h3>我們正在為你尋找最合適的引路人</h3>'+
        '<div class="sub">加入官方 LINE，配對好了第一個通知你。</div>'+
        '<div id="lead-form">'+
          '<a class="btn-primary btn-block" href="'+lineHref+'" target="_blank" rel="noopener">'+lineBtnTxt+'</a>'+
          '<p class="lead-mini">'+lineMini+'</p>'+
          policyBox+
        '</div></div>';
    } else {
      var lineBtn = CONFIG.lineUrl ? '<a class="btn-primary btn-block" style="margin-top:10px" href="'+CONFIG.lineUrl+'" target="_blank" rel="noopener">或加入官方 LINE</a>' : '';
      leadHtml='<div class="lead"><h3>我們正在為你尋找最合適的引路人</h3>'+
        '<div class="sub">留下聯絡方式，配對好了第一個通知你。</div>'+
        '<div id="lead-form"><div class="lead-row">'+
          '<input id="lead-input" type="text" placeholder="你的 Email 或 LINE ID" autocomplete="off">'+
          '<button class="btn-primary" id="lead-submit">通知我</button>'+
        '</div>'+
        '<label class="consent" id="consent-label"><input type="checkbox" id="lead-consent"><span>我同意提供上述聯絡方式，並已閱讀及同意'+policyLink+'。</span></label>'+
        policyBox+lineBtn+'</div></div>';
    }
    html='<div class="bar"><i style="width:100%;background:linear-gradient(90deg,#EE9E86,#F2C56E,#9FD49A,#86C9DA,#B0A2E4)"></i></div>'+
      '<div class="card fade">'+
        '<div class="res-kicker">你的相處頻率</div>'+
        '<div class="res-name serif">'+T.name+'</div>'+
        '<div class="res-combo">'+T.combo+'</div>'+
        '<div class="res-body">'+T.body+'</div>'+
        '<div>'+
          '<span class="pill pill1">'+p1+'</span><span class="pill pill2">'+p2+'</span><span class="pill pill3">'+p3+'</span>'+
        '</div>'+
        '<div class="note"><div class="lbl">適合你的引路人</div><p>'+T.guide+'</p></div>'+
        leadHtml+
      '</div>'+
      '<div class="actions">'+
        '<button class="btn-ghost" id="restart">重新測驗</button>'+
        '<button class="btn-line" id="share">分享給朋友</button>'+
      '</div>';
  }
  app.innerHTML=html;
  bind();
  postHeight();
}

function bind(){
  app.querySelectorAll('[data-topic]').forEach(function(b){b.onclick=function(){chooseTopic(b,b.getAttribute('data-topic'));};});
  app.querySelectorAll('[data-ans]').forEach(function(b){b.onclick=function(){chooseAns(b,parseInt(b.getAttribute('data-ans'),10));};});
  var rs=app.querySelector('#restart'); if(rs)rs.onclick=function(){S={step:0,topic:null,a1:0,a2:0,a3:0};render();};
  var sh=app.querySelector('#share'); if(sh)sh.onclick=function(){
    var u=CONFIG.shareUrl||location.href;
    var k=(S.a1<0?'R':'E')+(S.a2<0?'D':'G')+(S.a3<0?'I':'S');
    var nm=(TYPES[k]||{}).name||'';
    var msg='我剛測完彩之語的相處頻率測驗，我是「'+nm+'」型！你也來測測看 → '+u;
    window.open('https://line.me/R/msg/text/?'+encodeURIComponent(msg),'_blank');
  };
  var pt=app.querySelector('#policy-toggle');
  if(pt)pt.onclick=function(){var p=app.querySelector('#policy'); if(p)p.classList.toggle('open'); postHeight();};
  var ck=app.querySelector('#lead-consent');
  if(ck)ck.onchange=function(){var lbl=app.querySelector('#consent-label'); if(lbl)lbl.classList.remove('warn');};
  var ls=app.querySelector('#lead-submit');
  if(ls)ls.onclick=function(){
    var inp=app.querySelector('#lead-input'); var v=inp?inp.value.trim():'';
    if(!v){if(inp){inp.style.borderColor='#C0506A';inp.focus();}return;}
    var consent=app.querySelector('#lead-consent');
    if(consent&&!consent.checked){var lbl=app.querySelector('#consent-label'); if(lbl)lbl.classList.add('warn'); return;}
    ls.disabled=true; ls.textContent='送出中…';
    var key=(S.a1<0?'R':'E')+(S.a2<0?'D':'G')+(S.a3<0?'I':'S');
    submitLead({contact:v,type:TYPES[key].name,topic:tLabel(S.topic)},function(){
      var lf=app.querySelector('#lead-form');
      if(lf)lf.innerHTML='<div class="ok">'+checkmark()+'收到了！配對好的引路人，我們會第一個通知你。</div>';
      postHeight();
    });
  };
}

window.addEventListener('load',postHeight);
window.addEventListener('resize',postHeight);
render();
</script>
</body>
</html>
